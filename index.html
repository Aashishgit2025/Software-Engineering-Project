<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parent Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header id="parent-header">
  <h1>Parent Dashboard</h1>
  <button class="admin-btn" onclick="openPopup()">Admin Login</button>
</header>


<div class="container">
  <div class="dashboard">
    <a href="profile.html" class="card"><i class="fas fa-user-graduate"></i> Student Profile</a>
    <a href="attendance.html" class="card"><i class="fas fa-calendar-check"></i> Attendance</a>
    <a href="grades.html" class="card"><i class="fas fa-book-open"></i> Grades</a>
    <a href="fees.html" class="card"><i class="fas fa-money-check-alt"></i> Fees</a>
    <a href="announcements.html" class="card"><i class="fas fa-bullhorn"></i> Announcements</a>
   
  </div>
</div>

<!-- Popup Login -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h3>Admin Login</h3>
    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="checkLogin()">Login</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
