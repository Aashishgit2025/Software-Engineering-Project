<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Students</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header>
  <h1><i class="fas fa-users"></i> Manage Students</h1>
  <a href="admin.html" class="logout-btn">Back to Admin Dashboard</a>
</header>

<div class="container colorful">
  <h2>Student Records</h2>
  <button class="add-btn"><i class="fas fa-user-plus"></i> Add Student</button>

  <table class="styled-table">
    <thead>
      <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Class</th>
        <th>Guardian</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>12</td>
        <td>John Doe</td>
        <td>5</td>
        <td>Jane Doe</td>
        <td>
          <button class="edit-btn"><i class="fas fa-edit"></i></button>
          <button class="delete-btn"><i class="fas fa-trash-alt"></i></button>
        </td>
      </tr>
      <tr>
        <td>13</td>
        <td>Mary Smith</td>
        <td>6</td>
        <td>Robert Smith</td>
        <td>
          <button class="edit-btn"><i class="fas fa-edit"></i></button>
          <button class="delete-btn"><i class="fas fa-trash-alt"></i></button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
